<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Astartes">
  <title>Astartes Nutrition</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/codex.css">
  <link rel="stylesheet" href="css/onboard-fix.css">
  <link rel="stylesheet" href="css/marble-ward.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="sigil">
        <img src="assets/icon-192.png" alt="Selo">
        <div class="titles">
          <small>Codex Astartes</small>
          <strong>Astartes Nutrition</strong>
        </div>
      </div>
    </header>
    <main>
      <section class="page" id="page-onboard"></section>
      <section class="page" id="page-diario"></section>
      <section class="page" id="page-relato"></section>
      <section class="page" id="page-alimentos"></section>
      <section class="page" id="page-frater"></section>
    </main>
  </div>
  <nav class="nav">
    <button data-go="page-relato">Relato</button>
    <button data-go="page-diario" class="on">Diarium</button>
    <button class="plus" id="plus" aria-label="Adicionar">+</button>
    <button data-go="page-alimentos">Rações</button>
    <button data-go="page-frater">Frater</button>
  </nav>
  <div class="modal" id="modal" onclick="if(event.target===this)closeModal()"></div>
  <script src="js/foods.js"></script>
  <script src="js/labels-papa.js"></script>
  <script src="js/extras-patinho.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
